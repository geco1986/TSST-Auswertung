# Lokaler Build/Betrieb (Docker Desktop / Linux). Für TrueNAS: docker-compose.truenas.yml
services:
  tsst-auswertung:
    build: .
    image: tsst-auswertung:latest
    container_name: tsst-auswertung
    ports:
      - "5000:5000"          # Host:Container – Host-Port bei Bedarf ändern
    volumes:
      - tsst-data:/data      # persistente SQLite-Datenbank
    environment:
      DEBRA_DB: /data/debra.sqlite3
      DEBRA_SECRET: "bitte-hier-einen-eigenen-zufallswert-setzen"
      DEBRA_SEED: "1"        # 1 = bei leerer DB Demo-Daten laden, 0 = leer starten
      PORT: "5000"
    restart: unless-stopped

volumes:
  tsst-data:
